
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: securedocx
      POSTGRES_PASSWORD: securedocx
      POSTGRES_DB: securedocx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securedocx"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend-core:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL to use the docker service name, not localhost
      DATABASE_URL: postgresql://securedocx:securedocx@postgres:5432/securedocx
      # Override MinIO endpoint to use the docker service name
      MINIO_ENDPOINT: minio:9000
      # Ensure contracts/ is importable inside the container
      PYTHONPATH: /app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  minio_data:
